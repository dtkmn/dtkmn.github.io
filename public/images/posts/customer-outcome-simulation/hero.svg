<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Test customer outcomes, not AI agents</title>
  <desc id="desc">A clean systems diagram showing synthetic customer cohorts flowing through an AI agent change, domain-owned systems, and replayable outcome evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfaf6"/>
      <stop offset="54%" stop-color="#eeede6"/>
      <stop offset="100%" stop-color="#f7f6f1"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#252522"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-20%" width="124%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#1c1b16" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1c1b16" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M76 485C224 406 330 398 438 332C565 254 682 260 830 194C934 148 1030 100 1128 70" fill="none" stroke="#252522" stroke-width="3" stroke-opacity="0.11"/>

  <g filter="url(#shadow)">
    <rect x="72" y="84" width="352" height="214" rx="24" fill="#fbfaf6" stroke="#252522" stroke-opacity="0.16"/>
    <rect x="464" y="84" width="272" height="214" rx="24" fill="#fbfaf6" stroke="#252522" stroke-opacity="0.16"/>
    <rect x="776" y="84" width="352" height="214" rx="24" fill="#fbfaf6" stroke="#252522" stroke-opacity="0.16"/>
    <rect x="162" y="366" width="876" height="156" rx="28" fill="#252522"/>
  </g>

  <text x="104" y="132" fill="#706f68" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" letter-spacing="3">SYNTHETIC CUSTOMERS</text>
  <text x="104" y="184" fill="#050505" font-family="Newsreader, Georgia, serif" font-size="46">Controlled cohorts</text>
  <circle cx="122" cy="236" r="14" fill="#252522"/>
  <circle cx="166" cy="236" r="14" fill="#4f4a40"/>
  <circle cx="210" cy="236" r="14" fill="#706f68"/>
  <circle cx="254" cy="236" r="14" fill="#252522" opacity="0.52"/>
  <circle cx="298" cy="236" r="14" fill="#4f4a40" opacity="0.68"/>
  <circle cx="342" cy="236" r="14" fill="#706f68" opacity="0.55"/>

  <text x="496" y="132" fill="#706f68" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" letter-spacing="3">PROPOSED CHANGE</text>
  <text x="496" y="184" fill="#050505" font-family="Newsreader, Georgia, serif" font-size="46">Agent path</text>
  <rect x="502" y="224" width="166" height="14" rx="7" fill="#252522"/>
  <rect x="502" y="254" width="108" height="14" rx="7" fill="#706f68" opacity="0.5"/>

  <text x="808" y="132" fill="#706f68" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" letter-spacing="3">OUTCOME EVIDENCE</text>
  <text x="808" y="184" fill="#050505" font-family="Newsreader, Georgia, serif" font-size="46">Replay report</text>
  <rect x="814" y="224" width="236" height="14" rx="7" fill="#252522"/>
  <rect x="814" y="254" width="174" height="14" rx="7" fill="#706f68" opacity="0.5"/>

  <path d="M424 190H464" stroke="#252522" stroke-width="5" stroke-linecap="round"/>
  <path d="m448 174 18 16-18 16" fill="none" stroke="#252522" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M736 190H776" stroke="#252522" stroke-width="5" stroke-linecap="round"/>
  <path d="m760 174 18 16-18 16" fill="none" stroke="#252522" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="210" y="420" fill="#fbfaf6" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="18" letter-spacing="3">LAUNCH POSTURE</text>
  <text x="210" y="474" fill="#ffffff" font-family="Newsreader, Georgia, serif" font-size="54">Test customer outcomes, not AI agents.</text>
  <text x="210" y="512" fill="#dedbd0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="28">Ask who the customer became after the system touched them.</text>
</svg>
